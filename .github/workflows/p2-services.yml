name: P2 services
on:
  pull_request:
  push:
    branches: [main, p2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        service: [weather-service, planner-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync python -m pytest
      - run: uv audit --locked --preview-features audit-command
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: registry
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://registry:ci-only-password@localhost:5432/registry
      TEST_POSTGRES_URL: postgresql+psycopg://registry:ci-only-password@localhost:5432/registry
    defaults:
      run:
        working-directory: services/registry-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync python -m seed
      - run: uv run --no-sync python -m pytest tests/test_postgres.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REGISTRY_URL: http://127.0.0.1:8000
      WEATHER_URL: http://127.0.0.1:8001
      PLANNER_URL: http://127.0.0.1:8002
      PLAN_TIMEZONE: Asia/Jerusalem
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-browser-results
          path: services/frontend/test-results/
