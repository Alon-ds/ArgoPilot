name: Registry tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: services/registry-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Run integration tests
        run: uv run --no-sync python -W error::ResourceWarning -m unittest discover -s tests -v
