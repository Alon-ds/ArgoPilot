name: Registry tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: registry_test
          POSTGRES_PASSWORD: registry_test
          POSTGRES_DB: registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry_test -d registry_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: services/registry-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Run SQLite tests
        run: uv run --no-sync python -W error::ResourceWarning -m unittest discover -s tests -p 'test_api.py' -v
      - name: Run configuration tests
        run: uv run --no-sync python -W error::ResourceWarning -m unittest discover -s tests -p 'test_config.py' -v
      - name: Run PostgreSQL integration tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://registry_test:registry_test@127.0.0.1:5432/registry_test
        run: uv run --no-sync python -W error::ResourceWarning -m unittest discover -s tests -p 'test_postgres.py' -v
