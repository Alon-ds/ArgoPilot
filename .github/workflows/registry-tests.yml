name: Registry tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    defaults:
      run:
        working-directory: services/registry-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Run tests with coverage
        run: uv run --no-sync python -m pytest --cov --cov-report=term --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: services/registry-service/htmlcov/

  audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/registry-service

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
